  <text x="100" y="56" font-size="17" font-weight="700" fill="#ffffff">WinBrain OS · PITCH 脚本</text>
  <text x="100" y="74" font-size="11.5" fill="#dbe4ff">数据本体 → 业务专家 → 持续进化</text>

  <rect x="48" y="96" width="118" height="28" rx="14" fill="#ffffff" opacity="0.2"/>
  <text x="107" y="115" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CASE 1 · 本体构建</text>

  <text x="48" y="152" font-size="28" font-weight="700" fill="#ffffff">从 37 份字段文档，一键建「数据本体」</text>
  <text x="48" y="178" font-size="14" fill="#dbe4ff">演示 ontology-builder：上传字段释义文档 → AI 提取业务对象 → 扫描真实 DB → 发布本体</text>

  <rect x="48" y="188" width="150" height="22" rx="11" fill="#ffffff" opacity="0.14"/>
  <text x="123" y="203" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">⏱ 90s · 6 镜头</text>

