  <text x="44" y="1518" font-size="11" fill="#8a6d3a">混剪专家 eval 已存档（evals/regression.jsonl）；误判案例需预演（脚本为演示用，可标注示意）。</text>
  <text x="44" y="1536" font-size="11" fill="#8a6d3a">eval 运行真实；误判-修正段落可稍作编排（标注"示意流程"）；结尾突出"回归基线 · 越用越聪明"。</text>
