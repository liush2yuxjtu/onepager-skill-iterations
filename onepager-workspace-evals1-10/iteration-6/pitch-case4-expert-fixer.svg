  <text x="100" y="56" font-size="17" font-weight="700" fill="#ffffff">WinBrain OS · PITCH 脚本</text>
  <text x="100" y="74" font-size="11.5" fill="#dbe4ff">数据本体 → 业务专家 → 持续进化</text>

  <rect x="48" y="96" width="118" height="28" rx="14" fill="#ffffff" opacity="0.2"/>
  <text x="107" y="115" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CASE 4 · 专家进化</text>

  <text x="48" y="152" font-size="28" font-weight="700" fill="#ffffff">用 eval 喂专家，让它越用越聪明</text>
  <text x="48" y="178" font-size="14" fill="#dbe4ff">演示 skill-expert-fixer：跑回归 eval → 发现误判 → 修正规则 → 存档防回归</text>

  <rect x="48" y="188" width="150" height="22" rx="11" fill="#ffffff" opacity="0.14"/>
  <text x="123" y="203" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">⏱ 85s · 5 镜头</text>

  <!-- ===== Shot 1 ===== -->
  <g filter="url(#c4-card)">
    <rect x="24" y="232" width="1152" height="232" rx="16" fill="#ffffff" stroke="#e3e7f0"/>
  </g>
  <rect x="24" y="232" width="1152" height="34" rx="16" fill="#f1f3f9"/>
