  <text x="68" y="1440" font-size="8.5" font-weight="700" fill="#12a150">✓ 下次不回归 · 越用越聪明</text>

  <rect x="584" y="1344" width="572" height="96" rx="10" fill="#f6f8ff" stroke="#e3e7f0"/>
  <text x="600" y="1364" font-size="12" font-weight="700" fill="#3b5bdb">🎙 旁白</text>
  <text x="600" y="1384" font-size="12.5" fill="#24337a">"重跑全绿，存档基线——下次不回归。"</text>

  <!-- ===== Footer ===== -->
  <rect x="24" y="1476" width="1152" height="96" rx="12" fill="#fdf3e3" stroke="#f0ddc0"/>
