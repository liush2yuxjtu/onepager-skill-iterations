  <rect x="60" y="656" width="480" height="26" rx="7" fill="#fdf3e3" stroke="#d98a1f"/>
  <text x="70" y="670" font-size="9.5" fill="#d98a1f">✗ 低ROI诊断诚实性 · 未过</text>
  <text x="70" y="687" font-size="9" fill="#8a6d3a">根因：把同源改编的切片误判成重复</text>

  <rect x="584" y="600" width="572" height="96" rx="10" fill="#f6f8ff" stroke="#e3e7f0"/>
  <text x="600" y="620" font-size="12" font-weight="700" fill="#3b5bdb">🎙 旁白</text>
  <text x="600" y="640" font-size="12.5" fill="#24337a">"一条没过——它把切片误判成重复。</text>
  <text x="600" y="658" font-size="12.5" fill="#24337a">　定位根因。"</text>

  <!-- ===== Shot 3 ===== -->
  <g filter="url(#c4-card)">
    <rect x="24" y="728" width="1152" height="232" rx="16" fill="#ffffff" stroke="#e3e7f0"/>
  </g>
