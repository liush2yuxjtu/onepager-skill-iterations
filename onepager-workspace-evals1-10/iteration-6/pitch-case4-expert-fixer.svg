  <text x="44" y="814" font-size="12.5" fill="#5a6170">业务人反馈"这是同源改编，不是重复"</text>
  <text x="44" y="832" font-size="12.5" fill="#5a6170">expert-fixer 修正规则边界。</text>

  <rect x="44" y="848" width="520" height="96" rx="10" fill="#fbfcfe" stroke="#e3e7f0"/>
  <text x="60" y="868" font-size="11.5" font-weight="700" fill="#1a1d24">💬 业务人反馈</text>
  <rect x="60" y="876" width="480" height="22" rx="8" fill="#eef1ff"/>
  <text x="70" y="891" font-size="9.5" fill="#1a1d24">"这是同源改编，不是重复"</text>
  <text x="60" y="910" font-size="10" font-weight="700" fill="#1a1d24">expert-fixer 修正规则边界：</text>
  <text x="70" y="928" font-size="9.5" fill="#5a6170">重复判定需比对 素材ID + 同源标记，不同源改编不判重</text>
  <text x="60" y="940" font-size="8.5" fill="#8a91a0">evals/regression.jsonl · 更新中…</text>

  <rect x="584" y="848" width="572" height="96" rx="10" fill="#f6f8ff" stroke="#e3e7f0"/>
  <text x="600" y="868" font-size="12" font-weight="700" fill="#3b5bdb">🎙 旁白</text>
  <text x="600" y="888" font-size="12.5" fill="#24337a">"业务人说'这是同源改编，不是重复'</text>
  <text x="600" y="906" font-size="12.5" fill="#24337a">　——修正规则边界。"</text>

