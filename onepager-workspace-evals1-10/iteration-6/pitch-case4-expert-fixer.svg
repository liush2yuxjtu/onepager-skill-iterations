  <text x="62" y="255" font-size="14.5" font-weight="700" fill="#1a1d24">镜头 1 · 跑回归 eval</text>
  <text x="1144" y="255" font-size="13" font-weight="700" fill="#3b5bdb" text-anchor="end">0–30s</text>

  <text x="44" y="296" font-size="14" font-weight="700" fill="#1a1d24">画面 / 动作</text>
  <text x="44" y="318" font-size="12.5" fill="#5a6170">进专家「进化」入口，选中混剪专家，</text>
  <text x="44" y="336" font-size="12.5" fill="#5a6170">跑回归 eval。</text>

  <rect x="44" y="352" width="520" height="96" rx="10" fill="#fbfcfe" stroke="#e3e7f0"/>
  <text x="60" y="372" font-size="11.5" font-weight="700" fill="#1a1d24">混剪素材运营分析专家 · 进化</text>
  <rect x="60" y="382" width="150" height="22" rx="11" fill="#eef1ff"/>
  <text x="135" y="397" font-size="10" font-weight="700" fill="#3b5bdb" text-anchor="middle">▶ 跑回归 eval</text>
  <rect x="60" y="412" width="480" height="26" rx="7" fill="#f6f8fd" stroke="#e3e7f0"/>
  <text x="70" y="429" font-size="9.5" fill="#1a1d24">回归 2 条：品线映射 · 低ROI诊断诚实性</text>
  <text x="60" y="442" font-size="8.5" fill="#8a91a0">evals/regression.jsonl · 运行中…</text>

  <rect x="584" y="352" width="572" height="96" rx="10" fill="#f6f8ff" stroke="#e3e7f0"/>
  <text x="600" y="372" font-size="12" font-weight="700" fill="#3b5bdb">🎙 旁白</text>
  <text x="600" y="392" font-size="12.5" fill="#24337a">"专家会犯错——但每次错误都能</text>
  <text x="600" y="410" font-size="12.5" fill="#24337a">　变成训练。它自带 2 条回归 eval。"</text>

