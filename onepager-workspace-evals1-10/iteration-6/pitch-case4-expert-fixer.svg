  <rect width="1200" height="1600" fill="#f4f6f9"/>

  <!-- ===== Header ===== -->
  <rect x="0" y="0" width="1200" height="212" fill="url(#c4-hero)"/>
  <circle cx="1140" cy="60" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="60" cy="180" r="100" fill="#ffffff" opacity="0.05"/>

  <rect x="48" y="34" width="40" height="40" rx="12" fill="#ffffff" opacity="0.18"/>
