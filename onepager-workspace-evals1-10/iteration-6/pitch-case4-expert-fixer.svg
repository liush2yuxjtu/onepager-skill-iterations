  <text x="70" y="1166" font-size="9.5" fill="#12a150">✓ 低ROI诊断诚实性 · 通过</text>
  <rect x="60" y="1180" width="110" height="16" rx="8" fill="#e7f8ef"/>
  <text x="115" y="1191" font-size="9" font-weight="700" fill="#12a150" text-anchor="middle">✓ 2/2 全绿</text>

  <rect x="584" y="1096" width="572" height="96" rx="10" fill="#f6f8ff" stroke="#e3e7f0"/>
  <text x="600" y="1116" font-size="12" font-weight="700" fill="#3b5bdb">🎙 旁白</text>
  <text x="600" y="1136" font-size="12.5" fill="#24337a">"重跑全绿。"</text>

