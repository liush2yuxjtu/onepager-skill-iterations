<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>执行计划分析</title>
<style>
  :root{--bg:#0f1420;--card:#171e2e;--card2:#1d2637;--ink:#e7ecf3;--mut:#93a1b5;--line:#2a3550;
    --accent:#4da3ff;--ok:#2fd07c;--warn:#ffb454;--bad:#ff5c6c;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 18px 60px}
  a.back{color:var(--accent);font-size:12.5px;text-decoration:none}
  h1{font-size:22px;margin:10px 0 4px}
  .sub{color:var(--mut);font-size:12.5px;margin-bottom:16px}
  .verdict{background:linear-gradient(135deg,#1b2436,#14203a);border:1px solid #2e4a75;border-left:4px solid var(--warn);border-radius:10px;padding:12px 16px;margin:12px 0 18px;font-size:13.5px}
  .verdict b{color:var(--warn)}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .pill{font-size:12px;color:var(--mut);padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
  .pill.on{color:var(--accent);border-color:var(--accent)}
  .plan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .plan h3{font-size:14px;margin:0 0 2px}
  .plan h3 .qid{color:var(--accent);font-family:var(--mono)}
  .ptype{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;margin-left:8px}
  .ptype.ALL{background:rgba(255,92,108,.15);color:var(--bad)}
  .ptype.range,.ptype.temp,.ptype.subquery{background:rgba(255,180,84,.15);color:var(--warn)}
  .ptype.join{background:rgba(77,163,255,.15);color:var(--accent)}
  .plan .meta{font-size:11.5px;color:var(--mut);margin-bottom:10px}
  .ex{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;margin:6px 0 10px}
  .ex th{text-align:left;color:var(--mut);border-bottom:1px solid var(--line);padding:5px 10px;font-weight:600;white-space:nowrap}
  .ex td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .ex td.bad{color:var(--bad)} .ex td.ok{color:var(--ok)} .ex td.warn{color:var(--warn)}
  .dr{font-size:12.5px}
  .dr b{color:var(--accent)}
  .foot{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--mut)}
  .foot code{font-family:var(--mono);background:var(--card2);padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="main.html">← 返回结论页</a>
  <h1>执行计划分析</h1>
  <div class="sub">EXPLAIN 关键表解读 · 模拟数据</div>

  <div class="verdict">重点计划里 <b>6 条 ALL 全表扫描</b>（Q01/Q03/Q04/Q06/Q08/Q10）、<b>3 条 Using filesort</b>、<b>2 条 Using temporary</b>。共同根因：缺失复合索引 + 函数/隐式转换破坏索引。修 4 个高优索引后预计砍掉 <b>62%</b> 慢查询。</div>

  <div class="bar">
    <span class="pill on" data-f="ALL" onclick="flt(this)">全表扫描 ALL</span>
    <span class="pill" data-f="filesort" onclick="flt(this)">filesort</span>
    <span class="pill" data-f="temp" onclick="flt(this)">temporary</span>
    <span class="pill" data-f="join" onclick="flt(this)">join</span>
    <span class="pill" data-f="clear" onclick="clearF(this)">全部</span>
  </div>
  <div id="list"></div>

  <div class="foot">来源：<code>onepager</code> · <code>sub-plans.html</code> · 采集示意：<code>EXPLAIN ANALYZE</code>（模拟数据）</div>
</div>

<script>
const PLANS=[
 {qid:"Q01",tags:["join","ALL"],name:"订单列表 5 表 LEFT JOIN",meta:"orders(o) → users(u) → order_items(oi) → products(p) → addresses(ad) → pay_records(pr)",
  ex:[["orders o","ALL","NULL","1.4M","—","扫描 status"],
      ["order_items oi","ALL","NULL","8.2M","—","oi.order_id 无索引"],
      ["users u","eq_ref","PRIMARY","1","100","OK"],
      ["products p","eq_ref","PRIMARY","1","100","OK"]],
  dr:"驱动表 orders 全扫 + order_items 反查全扫。加 <b>idx_orders_status_ctime(status, created_at, id)</b> 与 <b>idx_oi_order_id(order_id)</b> 可去 2 个 ALL。"},
 {qid:"Q02",tags:["range"],name:"批量状态更新 range 扫",meta:"order_archive（5.8 亿行）",
  ex:[["order_archive","range","NULL","212M","5","BETWEEN 无索引 → 全表 range"]],
  dr:"212M 行回表 + 行锁。加 <b>idx_oa_ctime_status(created_at, status)</b>，并分批 LIMIT 更新。"},
 {qid:"Q03",tags:["ALL","filesort"],name:"商品名 LIKE 前导通配",meta:"products（9,600 万行）",
  ex:[["products","ALL","NULL","96M","0.03","LIKE '%kw%' 前导通配"],
      ["","filesort","","—","","ORDER BY sales"]],
  dr:"前导通配必然全扫 + 排序。改 <b>FULLTEXT(name)</b> 或 ES；至少去掉前导通配。"},
 {qid:"Q04",tags:["ALL","filesort"],name:"订单列表深分页 OFFSET",meta:"orders（1.4 亿行）",
  ex:[["orders","ALL","NULL","100M","30","OFFSET 1000000 扫描丢弃"]],
  dr:"OFFSET 深分页物理扫描。改 <b>游标分页 WHERE id&lt;?</b>；补 (created_at, id) 索引。"},
 {qid:"Q05",tags:["subquery"],name:"相关子查询 COUNT",meta:"orders × order_items",
  ex:[["orders","ref","idx_user_id","50","100","驱动 50 行"],
      ["order_items","ALL","NULL","8.2M","—","每行全扫 → 412M 查找"]],
  dr:"相关子查询逐行触发全扫。改 JOIN+GROUP BY，并加 <b>idx_oi_order_id(order_id)</b>。"},
 {qid:"Q06",tags:["ALL","filesort"],name:"OR 条件破坏索引",meta:"orders",
  ex:[["orders","ALL","NULL","1.4M","1","OR 分支合并放弃索引"],
      ["","filesort","","—","","ORDER BY created_at"]],
  dr:"改写 status IN (...) + 复合索引 (status, created_at)；或 UNION ALL。"},
 {qid:"Q07",tags:["temp","join"],name:"GROUP BY 客户分段",meta:"fact_orders × dim_customer",
  ex:[["fact_orders","ALL","NULL","58M","—","无覆盖索引"],
      ["dim_customer","eq_ref","PRIMARY","1","100","OK"],
      ["<temporary>","Using temporary","","1.85G","—","临时表落盘"]],
  dr:"1.85G 临时表。加覆盖索引 (day, cust_id) + dim_customer(segment)；或物化视图。"},
 {qid:"Q08",tags:["ALL"],name:"COUNT(*) 全表扫日志",meta:"event_log（32 亿行）",
  ex:[["event_log","ALL","NULL","3.2G","1","level/created_at 无索引"]],
  dr:"每次 COUNT 扫 3.2G。建 (level, created_at) 覆盖索引；大表建议计数表/分区。"},
 {qid:"Q10",tags:["ALL"],name:"函数包裹破坏索引",meta:"orders",
  ex:[["orders","ALL","NULL","1.4M","5","DATE() 包裹 created_at 索引失效"]],
  dr:"改写为 created_at 范围比较即可命中索引。"},
 {qid:"Q11",tags:["ALL"],name:"隐式类型转换",meta:"orders（order_no VARCHAR）",
  ex:[["orders","ALL","NULL","1.4M","1","VARCHAR=数值 → 隐式转换丢索引"]],
  dr:"应用层统一传字符串 order_no，即可命中 idx_order_no。"},
 {qid:"Q14",tags:["lock"],name:"库存 UPDATE 锁竞争",meta:"inventory（热点 SKU 行锁）",
  ex:[["inventory","eq_ref","PRIMARY","1","100","行锁排队 4.9s 等待"]],
  dr:"非扫描问题，是锁等待。合并 SELECT...FOR UPDATE + UPDATE 为单条原子 UPDATE；热点拆行。"},
 {qid:"Q16",tags:["join","ALL"],name:"LEFT JOIN 驱动顺序错误",meta:"orders → users → order_items",
  ex:[["orders","ref","idx_user_id","1","—","驱动正确"],
      ["order_items","ALL","NULL","8.2M","—","探测全表"]],
  dr:"order_items 反查无索引导致 610M 探测。加 idx_oi_order_id；或 STRAIGHT_JOIN 调序。"},
 {qid:"Q18",tags:["join","ALL"],name:"明细表关联无索引 FK",meta:"order_detail × orders",
  ex:[["orders","ref","idx_user_id","80","100","OK"],
      ["order_detail","ALL","NULL","6.9M","—","order_id 无索引反查"]],
  dr:"加 <b>idx_od_order_id(order_id)</b>，同时覆盖 Q05。"}
];
const tags={ALL:"全表扫描 ALL",filesort:"filesort",temp:"temporary",join:"join",lock:"锁等待",subquery:"子查询",range:"range"};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
let f=null;
function cls(t){return t==="ALL"?"bad":t==="lock"?"warn":(t==="join"?"ok":"warn")}
function render(){
  const list=(f?PLANS.filter(p=>p.tags.includes(f)):PLANS);
  document.getElementById("list").innerHTML=list.map(p=>`
    <div class="plan">
      <h3><span class="qid">${p.qid}</span> ${esc(p.name)}
        ${p.tags.map(t=>`<span class="ptype ${t}">${tags[t]}</span>`).join("")}</h3>
      <div class="meta">${esc(p.meta)}</div>
      <table class="ex">
        <tr>${["TABLE","type","key","rows","filtered","说明"].map(h=>`<th>${h}</th>`).join("")}</tr>
        ${p.ex.map(r=>`<tr>${r.map((c,i)=>i>=1&&i<=3?`<td class="${cls(r[1])}">${esc(c)}</td>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}
      </table>
      <div class="dr"><b>解读</b>：${p.dr}</div>
    </div>`).join("");
}
function flt(el){
  document.querySelectorAll(".pill").forEach(x=>x.classList.remove("on"));
  el.classList.add("on"); f=el.dataset.f; render();
}
function clearF(el){
  document.querySelectorAll(".pill").forEach(x=>x.classList.remove("on"));
  f=null; render();
}
render();
</script>
</body>
</html>
